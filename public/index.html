<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f2a">
  <meta name="description" content="استودیو رسانه‌ای نسرا اصفهان؛ تیم مجازی تولید و انتشار محتوا با تأیید مالک">
  <title>نسرا اصفهان | استودیو رسانه‌ای</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login-view" class="login-screen">
    <div class="login-card">
      <div class="brand-mark large">ن</div>
      <p class="eyebrow">NASRA ESFAHAN MEDIA STUDIO</p>
      <h1>نسرا اصفهان</h1>
      <p class="muted">استودیو رسانه‌ای با تیم مجازی و تأیید نهایی مالک</p>
      <form id="login-form" class="stack" autocomplete="on">
        <label>رمز عبور مالک
          <input id="login-password" name="password" type="password" required minlength="1" autocomplete="current-password" dir="ltr" placeholder="••••••••">
        </label>
        <button class="btn primary full" type="submit">ورود به استودیو</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
      <p class="small muted">رمز فقط در Cloudflare Secrets نگهداری می‌شود. کوکی نشست HttpOnly و دارای CSRF است.</p>
    </div>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">ن</div>
        <div><strong>نسرا اصفهان</strong><span>استودیو رسانه‌ای</span></div>
        <button id="close-sidebar" class="icon-btn mobile-only" aria-label="بستن منو">×</button>
      </div>
      <div class="owner-chip"><span class="status-dot"></span> حالت مالک: همه اقدام‌ها با تأیید شما</div>
      <nav id="main-nav" aria-label="صفحات اصلی">
        <button data-route="dashboard" class="nav-item active"><span>⌂</span>داشبورد</button>
        <button data-route="approvals" class="nav-item"><span>✓</span>صف تأییدها <b id="approval-count" class="nav-count hidden"></b></button>
        <button data-route="pipeline" class="nav-item"><span>▦</span>کانبان تولید</button>
        <button data-route="calendar" class="nav-item"><span>▤</span>تقویم جلالی</button>
        <button data-route="sources" class="nav-item"><span>⌁</span>کتابخانه منابع</button>
        <button data-route="playbook" class="nav-item"><span>▥</span>پلی‌بوک و برند</button>
        <button data-route="agents" class="nav-item"><span>✦</span>تیم AI و پرامپت‌ها</button>
        <button data-route="inbox" class="nav-item"><span>◌</span>صندوق ورودی</button>
        <button data-route="analytics" class="nav-item"><span>↗</span>تحلیل و آزمایش</button>
        <button data-route="publish" class="nav-item"><span>↗</span>مرکز انتشار</button>
        <button data-route="integrations" class="nav-item"><span>⚙</span>یکپارچه‌سازی‌ها</button>
        <button data-route="settings" class="nav-item"><span>☷</span>تنظیمات و سلامت</button>
        <button data-route="logs" class="nav-item"><span>≡</span>لاگ و حسابرسی</button>
        <button data-route="backup" class="nav-item"><span>⇩</span>پشتیبان‌گیری</button>
        <button data-route="selftest" class="nav-item"><span>✓</span>آزمون پذیرش</button>
      </nav>
      <div class="sidebar-footer"><span>نسخه ۱٫۰٫۰</span><span>UTC+۰۳:۳۰ تهران</span></div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
    <main class="main-area">
      <header class="topbar">
        <button id="open-sidebar" class="icon-btn mobile-only" aria-label="باز کردن منو">☰</button>
        <div><p id="page-kicker" class="eyebrow">NASRA / STUDIO</p><h2 id="page-title">داشبورد</h2></div>
        <div class="topbar-actions"><span id="live-clock" class="clock"></span><button id="refresh-page" class="icon-btn" title="تازه‌سازی">↻</button><button id="logout-btn" class="btn ghost small-btn">خروج</button></div>
      </header>
      <div id="app" class="page-content" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card"><div class="modal-head"><h3 id="modal-title"></h3><button class="icon-btn" data-close-modal aria-label="بستن">×</button></div><div id="modal-body"></div></div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
