name: Test unified studio core
on:
  push:
    branches: [arena/ca505b48-font]
    paths: ['local-ai-poc/studio-core/**', 'local-ai-poc/settings.gradle.kts', 'local-ai-poc/build.gradle.kts', '.github/workflows/test-studio-core.yml']
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Test project contracts and engine lifecycle
        working-directory: local-ai-poc
        run: chmod +x gradlew && ./gradlew --no-daemon :studio-core:test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: studio-core-test-results
          path: local-ai-poc/studio-core/build/test-results/test
