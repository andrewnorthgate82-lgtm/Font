name: Build APK

# PromptSaz lives in the PromptSaz/ subfolder of this repository.
on:
  push:
    branches: [main, "arena/01a0fc10-font"]
    paths: ["PromptSaz/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PromptSaz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain > /tmp/gradle.log 2>&1 || {
            STRIP='s/\x1b\[[0-9;]*m//g'
            # Kotlin diagnostics (e: file.kt:line:col message) — the real errors
            sed "$STRIP" /tmp/gradle.log | grep -E "^e: |: error:|error: " | head -12 | cut -c1-400 | sed 's/^/::error::/' || true
            # failure summary lines
            sed "$STRIP" /tmp/gradle.log | grep -E "FAILED|What went wrong|Caused by|Unresolved|Execution failed" | head -8 | cut -c1-250 | sed 's/^/::error::/' || true
            # JUnit failure messages
            find app/build/test-results -name "*.xml" 2>/dev/null | while read f; do
              grep -o 'message="[^"]*"' "$f" 2>/dev/null | head -3 | sed "s|^|::error::$(basename "$f"): |" || true
            done
            exit 1
          }

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --console=plain > /tmp/gradle-build.log 2>&1 || {
            grep -E "error:|^e: |^w: |Caused by|What went wrong|Could not|Unsupported|requires|incompatible|compile against|classpath" /tmp/gradle-build.log | head -45 | sed 's/^/::error::/' || true
            exit 1
          }

      - name: Rename APK to PromptSaz.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk PromptSaz.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptSaz-apk
          path: PromptSaz/PromptSaz.apk

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PromptSaz/PromptSaz.apk \
            --title "PromptSaz APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "خودکار از آخرین کد ساخته شد.
          دانلود: PromptSaz.apk — روی گوشی باز کنید و اجازه نصب بدهید." \
            --latest

      - name: Push failure logs to branch (diagnostics)
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "$GITHUB_REF_NAME" 2>/dev/null || true
          mkdir -p ci-logs
          cp /tmp/gradle.log "ci-logs/run-${GITHUB_RUN_NUMBER}-test.log" 2>/dev/null || true
          cp /tmp/gradle-build.log "ci-logs/run-${GITHUB_RUN_NUMBER}-build.log" 2>/dev/null || true
          git add ci-logs || true
          git commit -m "CI failure logs (run ${GITHUB_RUN_NUMBER}) [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
