name: Build Local AI POC APKs

on:
  workflow_dispatch:
  push:
    branches:
      - arena/ca505b48-font
    paths:
      - "local-ai-poc/**"
      - ".github/workflows/build-local-ai-poc.yml"

permissions:
  contents: write

jobs:
  build-debug-apks:
    name: Build Android debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: local-ai-poc/**/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build text and image POC APKs
        working-directory: local-ai-poc
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :image-poc:assembleDebug > "$RUNNER_TEMP/gradle-build.log" 2>&1
          build_status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [ "$build_status" -ne 0 ]; then
            diagnostics="$RUNNER_TEMP/gradle-diagnostics.txt"
            grep -Ei '(^e:|error:|failure:|what went wrong|caused by:)' "$RUNNER_TEMP/gradle-build.log" | tail -n 40 > "$diagnostics" || true
            if [ ! -s "$diagnostics" ]; then
              tail -n 40 "$RUNNER_TEMP/gradle-build.log" > "$diagnostics"
            fi
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::error title=Gradle diagnostic::$line"
            done < "$diagnostics"
            exit "$build_status"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: local-ai-poc-apks
          path: |
            local-ai-poc/app/build/outputs/apk/debug/app-debug.apk
            local-ai-poc/image-poc/build/outputs/apk/debug/image-poc-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="local-ai-poc-build-${GITHUB_RUN_ID}"
          text_apk="$RUNNER_TEMP/local-ai-poc-debug.apk"
          image_apk="$RUNNER_TEMP/local-image-poc-debug.apk"
          cp local-ai-poc/app/build/outputs/apk/debug/app-debug.apk "$text_apk"
          cp local-ai-poc/image-poc/build/outputs/apk/debug/image-poc-debug.apk "$image_apk"
          notes=$(cat <<EOF
          Experimental Android POC builds for on-device AI evaluation.

          Assets:
          - local-ai-poc-debug.apk: offline Persian text-generation POC.
          - local-image-poc-debug.apk: separate experimental image-generation POC (app version 0.1.1) using MediaPipe Image Generator 0.10.26.1, with a protobuf runtime compatibility fix for initialization. The image model is not bundled; the app downloads and verifies a separate approximately 2.07 GB model archive. The MediaPipe Image Generator task is deprecated and no longer actively maintained. This APK has not been tested on the user's Redmi Note 13 Pro+; image quality, latency, memory, thermal behavior, and stability require a real-device test.

          First model downloads require Wi-Fi/internet. Inference is intended to run locally after the model is ready.
          Source commit: ${GITHUB_SHA}
          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$text_apk" "$image_apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$text_apk" "$image_apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Local AI POC build ${GITHUB_RUN_NUMBER}" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
