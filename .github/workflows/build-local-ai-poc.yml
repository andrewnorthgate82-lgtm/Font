name: Build Local AI POC APKs

on:
  workflow_dispatch:
  push:
    branches:
      - arena/ca505b48-font
    paths:
      - "local-ai-poc/**"
      - ".github/workflows/build-local-ai-poc.yml"

permissions:
  contents: write

jobs:
  build-debug-apks:
    name: Build Android debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: local-ai-poc/**/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build text and image POC APKs
        working-directory: local-ai-poc
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :image-poc:assembleDebug > "$RUNNER_TEMP/gradle-build.log" 2>&1
          build_status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [ "$build_status" -ne 0 ]; then
            diagnostics="$RUNNER_TEMP/gradle-diagnostics.txt"
            grep -Ei '(^e:|error:|failure:|what went wrong|caused by:)' "$RUNNER_TEMP/gradle-build.log" | tail -n 40 > "$diagnostics" || true
            if [ ! -s "$diagnostics" ]; then
              tail -n 40 "$RUNNER_TEMP/gradle-build.log" > "$diagnostics"
            fi
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::error title=Gradle diagnostic::$line"
            done < "$diagnostics"
            exit "$build_status"
          fi

      - name: Test studio core
        working-directory: local-ai-poc
        run: ./gradlew --no-daemon :studio-core:test :app:testDebugUnitTest

      - name: Sign studio and image APKs with persistent key
        env:
          SIGNING_KEY_B64: ${{ secrets.LOCAL_IMAGE_POC_SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.LOCAL_IMAGE_POC_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          # These generated hex/Base64 secrets contain no meaningful whitespace.
          export SIGNING_PASSWORD="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')"
          SIGNING_KEY_B64="$(printf '%s' "$SIGNING_KEY_B64" | tr -d '[:space:]')"
          test -n "$SIGNING_KEY_B64" || { echo '::error::Image signing key secret is missing'; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo '::error::Image signing password secret is missing'; exit 1; }
          keystore="$RUNNER_TEMP/image-signing.p12"
          trap 'rm -f "$keystore"' EXIT
          if ! printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$keystore"; then
            echo '::error::Signing key secret is not valid Base64. Recopy the complete value.'
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storetype PKCS12 -storepass:env SIGNING_PASSWORD -alias font-image-poc > "$RUNNER_TEMP/key-check.log" 2>&1; then
            echo '::error::Signing key could not be opened with the supplied password and alias.'
            while IFS= read -r line; do echo "::error title=Signing validation::$line"; done < "$RUNNER_TEMP/key-check.log"
            exit 1
          fi
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in local-ai-poc/app/build/outputs/apk/debug/app-debug.apk local-ai-poc/image-poc/build/outputs/apk/debug/image-poc-debug.apk; do
          "$signer" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias font-image-poc \
            --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD \
            --out "$RUNNER_TEMP/signed-image.apk" "$apk"
          "$signer" verify --verbose --print-certs "$RUNNER_TEMP/signed-image.apk"
          cp "$RUNNER_TEMP/signed-image.apk" "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: local-ai-poc-apks
          path: |
            local-ai-poc/app/build/outputs/apk/debug/app-debug.apk
            local-ai-poc/image-poc/build/outputs/apk/debug/image-poc-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="local-ai-poc-build-${GITHUB_RUN_ID}"
          text_apk="$RUNNER_TEMP/local-ai-poc-debug.apk"
          image_apk="$RUNNER_TEMP/local-image-poc-debug.apk"
          cp local-ai-poc/app/build/outputs/apk/debug/app-debug.apk "$text_apk"
          cp local-ai-poc/image-poc/build/outputs/apk/debug/image-poc-debug.apk "$image_apk"
          notes=$(cat <<EOF
          Experimental Android POC builds for on-device AI evaluation.

          Assets:
          - local-ai-poc-debug.apk: experimental content studio 0.2.0 (com.font.localstudio), using the existing local Gemma E2B/E4B text engine. Generates three structured proposals, allows selection and text editing, and saves/reopens one local project with revision history. Installs alongside the old text POC; does NOT reuse its private model files. A separate model download is required. Keep old apps and data. Signed using the persistent key. Not yet device-tested. No visual editor, image integration or social publishing in this build.
          - local-image-poc-debug.apk: separate experimental image-generation POC (app version 0.1.2) using MediaPipe Image Generator 0.10.26.1, with a protobuf runtime compatibility fix for initialization. This version has a new application ID (com.font.localimagepoc.stable) and a persistent signing key. It installs alongside the old image app, NOT as its update. Keep the old app and its data. The new app requires its own model download. The image model is not bundled; the app downloads and verifies a separate approximately 2.07 GB model archive. The MediaPipe Image Generator task is deprecated and no longer actively maintained. This APK has not been tested on the user's Redmi Note 13 Pro+; image quality, latency, memory, thermal behavior, and stability require a real-device test.

          First model downloads require Wi-Fi/internet. Inference is intended to run locally after the model is ready.
          Source commit: ${GITHUB_SHA}
          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$text_apk" "$image_apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$text_apk" "$image_apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Local AI POC build ${GITHUB_RUN_NUMBER}" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
