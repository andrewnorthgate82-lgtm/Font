name: Build Local AI POC APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/ca505b48-font
    paths:
      - "local-ai-poc/**"
      - ".github/workflows/build-local-ai-poc.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: local-ai-poc/**/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: local-ai-poc
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug > "$RUNNER_TEMP/gradle-build.log" 2>&1
          build_status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [ "$build_status" -ne 0 ]; then
            diagnostics="$RUNNER_TEMP/gradle-diagnostics.txt"
            grep -Ei '(^e:|error:|failure:|what went wrong|caused by:)' "$RUNNER_TEMP/gradle-build.log" | tail -n 40 > "$diagnostics" || true
            if [ ! -s "$diagnostics" ]; then
              tail -n 40 "$RUNNER_TEMP/gradle-build.log" > "$diagnostics"
            fi
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::error title=Gradle diagnostic::$line"
            done < "$diagnostics"
            exit "$build_status"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: local-ai-poc-debug-apk
          path: local-ai-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
