# PromptSaz — project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx3g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError

# Run builds in parallel where possible.
org.gradle.parallel=true

# Reuse task outputs between builds.
org.gradle.caching=true

# AndroidX package structure.
android.useAndroidX=true

# Kotlin official code style.
kotlin.code.style=official
