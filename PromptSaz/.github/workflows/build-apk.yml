name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK to PromptSaz.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk PromptSaz.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptSaz-apk
          path: PromptSaz.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PromptSaz.apk \
            --title "PromptSaz APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "خودکار ساخته شد از آخرین کد main.
          دانلود: PromptSaz.apk — برای نصب، فایل را روی گوشی باز کنید و اجازه نصب از منابع ناشناس را بدهید." \
            --latest
