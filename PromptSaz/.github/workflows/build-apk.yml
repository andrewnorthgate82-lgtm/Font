name: Build APK

# Standalone-repo workflow: use this file when PromptSaz lives at the repository
# root (e.g. a dedicated promptsaz-android repository). The Font repository
# uses the variant at .github/workflows/build-apk.yml with a PromptSaz/
# working-directory prefix.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace > /tmp/gradle.log 2>&1 || {
            grep -E "FAILED|tests completed|AssertionError" /tmp/gradle.log | head -40 | sed 's/^/::error::/' || true
            find app/build/test-results -name "*.xml" 2>/dev/null | while read f; do
              grep -o 'message="[^"]*"' "$f" 2>/dev/null | head -3 | sed "s|^|::error::$(basename "$f"): |" || true
            done
            grep -E "error:|e: file|Caused by|What went wrong|Could not" /tmp/gradle.log | head -25 | sed 's/^/::error::/' || true
            exit 1
          }

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace > /tmp/gradle-build.log 2>&1 || {
            grep -E "error:|e: file|Caused by|What went wrong|Could not" /tmp/gradle-build.log | head -25 | sed 's/^/::error::/' || true
            exit 1
          }

      - name: Rename APK to PromptSaz.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk PromptSaz.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptSaz-apk
          path: PromptSaz.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" PromptSaz.apk \
            --title "PromptSaz APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "خودکار از آخرین کد ساخته شد.
          دانلود: PromptSaz.apk — روی گوشی باز کنید و اجازه نصب بدهید." \
            --latest
