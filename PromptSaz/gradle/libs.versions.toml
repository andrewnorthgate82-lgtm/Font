# PromptSaz version catalog — the single source of truth for dependency versions.
# Every version below was verified against official sources on 2026-10-02:
#   - Google Maven artifacts: developer.android.com release pages (AGP, Compose BOM,
#     Room, Navigation, Lifecycle, Activity, Core, DataStore, security-crypto, androidx.hilt)
#   - GitHub Releases: JetBrains/kotlin, google/dagger, google/ksp, Kotlin/kotlinx.serialization,
#     Kotlin/kotlinx.coroutines
#   - AGP-9 compatibility notes: KSP must be >= 2.3.6 and Hilt >= 2.59.2 on AGP 9
#     (per Google's official agp-9-upgrade skill, updated 2026-09-18). Both are satisfied.

[versions]
# Toolchain pinned to a proven AGP-9.4 built-in-Kotlin matrix (verified working
# combination, Sept 2026): Kotlin 2.2.10 (AGP built-in default), KSP 2.3.12
# (built-in Kotlin support since 2.3.1), Hilt 2.60.1 (built for AGP 9, runs its
# compiler under KSP2), androidx.hilt 1.4.0. Raising Kotlin above the built-in
# default broke Dagger's annotation resolution ("HiltViewModel could not be resolved").
agp = "9.4.0"
kotlin = "2.2.10"
ksp = "2.3.12"
hilt = "2.60.1"
androidxHiltLifecycleViewmodel = "1.4.0"
androidxCore = "1.19.0"
androidxActivityCompose = "1.13.0"
androidxComposeBom = "2026.02.01"
androidxLifecycle = "2.11.0"
androidxNavigationCompose = "2.10.2"
androidxRoom = "2.8.5"
androidxDatastore = "1.2.1"
androidxSecurityCrypto = "1.1.0"
kotlinxSerializationJson = "1.11.0"
kotlinxCoroutines = "1.11.0"
junit = "4.13.2"

[libraries]
# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivityCompose" }

# Compose (versions resolved by the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

# Lifecycle + Navigation
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigationCompose" }

# Hilt (androidx.hilt 1.3.0 moved hiltViewModel() to hilt-lifecycle-viewmodel-compose)
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHiltLifecycleViewmodel" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }

# Preferences + secure storage
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "androidxSecurityCrypto" }

# Kotlin ecosystem
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
